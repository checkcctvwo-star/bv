name: Test

on:
  push:
    branches:
      - feat/account-switching
      - main
      - master
  pull_request:

jobs:
  test:
    name: Unit Tests + Compile Check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DATA" ]; then
            echo "$DATA" > app/google-services.json
          else
            echo '{"project_info":{"project_number":"000000000000","firebase_url":"https://placeholder.firebaseio.com","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:placeholder","android_client_info":{"package_name":"dev.aaa1115910.bv"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :bili-api:test --tests "dev.aaa1115910.biliapi.account.*" --tests "dev.aaa1115910.biliapi.player.*"

      - name: Compile app (debug)
        run: ./gradlew assembleDefaultDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bv-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error